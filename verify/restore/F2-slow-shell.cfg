\* Finding F2, what's left after pane_agent(). Must FAIL on SavedChatSurvives:
\* the shell takes longer than RESUME_GRACE + EXIT_CONFIRM to run the typed
\* resume line, so the record is forgotten before the agent exists. A later
\* pass saves the chat again once its agent shows up; a restart in between
\* loses it.
SPECIFICATION Spec
CONSTANTS
  MaxRestarts  = 2
  MaxWatchers  = 3
  MaxPids      = 3
  MaxChats     = 2
  MaxTime      = 5
  EXIT_CONFIRM = 1
  RESUME_GRACE = 2
  Handoff      = FALSE
  FenceMidStep = TRUE
  FenceResume  = FALSE
INVARIANTS
  TypeOK
  SavedChatSurvives
CHECK_DEADLOCK FALSE
