\* Must pass. One watcher at a time, two restarts, three agents, three chats.
\* Real values are EXIT_CONFIRM = 2 s and RESUME_GRACE = 15 s against a 3 s
\* pass; the clock here ticks freely between steps, so only grace > confirm
\* matters. Both fences on: see SKILL.md, findings F1 and F2. With them on,
\* Ctrl-Z, editors, and watcher handoffs still move freely.
SPECIFICATION Spec
CONSTANTS
  MaxRestarts  = 2
  MaxWatchers  = 3
  MaxPids      = 3
  MaxChats     = 3
  MaxTime      = 5
  EXIT_CONFIRM = 1
  RESUME_GRACE = 2
  Handoff      = FALSE
  FenceMidStep = TRUE
  FenceResume  = TRUE
INVARIANTS
  TypeOK
  OneResumePerShell
  ResumeLandsAtPrompt
  SavedChatSurvives
CHECK_DEADLOCK FALSE
