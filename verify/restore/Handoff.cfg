\* Must pass. A second watcher can start while one runs (`bunk start`,
\* `bunk install`, a config reload), at any moment, even mid-step. Smaller
\* bounds than Restore.cfg: one restart, two agents, two chats. Both fences on.
SPECIFICATION Spec
CONSTANTS
  MaxRestarts  = 1
  MaxWatchers  = 3
  MaxPids      = 2
  MaxChats     = 2
  MaxTime      = 4
  EXIT_CONFIRM = 1
  RESUME_GRACE = 2
  Handoff      = TRUE
  FenceMidStep = TRUE
  FenceResume  = TRUE
INVARIANTS
  TypeOK
  OneResumePerShell
  ResumeLandsAtPrompt
  SavedChatSurvives
CHECK_DEADLOCK FALSE
